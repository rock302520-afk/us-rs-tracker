name: 每日更新美股強弱資料

on:
  schedule:
    # 22:30 UTC 週一~週五 = 台灣時間 06:30（週二~週六），美股收盤後（含夏令/冬令時間）
    - cron: "30 22 * * 1-5"
  workflow_dispatch: {}     # 也可在 Actions 頁面手動按「Run workflow」

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python update_data.py
      - name: Commit data
        run: |
          git config user.name  "rs-bot"
          git config user.email "rs-bot@users.noreply.github.com"
          git add docs/data.json docs/data.js constituents.json
          git diff --cached --quiet || git commit -m "data: $(date -u +%F)"
          git push
